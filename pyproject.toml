[project]
name = "gpre"
version = "0.1.0"
description = "GPU Monte Carlo pricing and risk engine: Philox and Sobol paths, Greeks by pathwise, LR and AAD, full-revaluation VaR, with fair CPU baselines."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "avmhdt" }]
dependencies = [
    "jax>=0.6",
    "numpy>=2.0",
    "scipy>=1.13",
    "polars>=1.0",
    "pyarrow>=16",
    "duckdb>=1.1",
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "matplotlib>=3.9",
    "structlog>=24.1",
]

[project.scripts]
gpre = "gpre.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpre"]

[dependency-groups]
gpu = [
    "jax[cuda12]>=0.6",
    "cupy-cuda12x>=13.3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6",
    "types-jsonschema>=4.23",
    "pre-commit>=3.8",
    "quantlib>=1.34",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/gpre"]
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["cupy.*", "QuantLib.*", "scipy.*", "pyarrow.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
pythonpath = ["tests"]
markers = [
    "gpu: needs an NVIDIA GPU and CuPy; runs on the cloud instance only",
    "slow: slower tests, run locally before each milestone exit",
    "data: needs local licensed or downloaded data, never in CI",
    "bench: benchmark runs, never in CI",
    "validation: validation against closed forms and lattices",
]

[tool.coverage.run]
data_file = ".pytest_cache/coverage"
source_pkgs = ["gpre"]
omit = ["*/gpre/cuda/launch.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", '^\s*\.\.\.$']
